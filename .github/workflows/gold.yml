name: gold-monitor

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      SENDKEY: ${{ secrets.SENDKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run monitor
        run: python monitor.py

      - name: Save state back to repo
        run: |
          git config user.name "gold-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json monitor.log || true
          if git diff --cached --quiet; then
            echo "state unchanged, skip commit"
          else
            git commit -m "state update [skip ci]"
            git push
          fi

      # 手动触发时发送测试推送，验证微信能收到；定时调度不会执行这步
      - name: Push test on manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: python monitor.py --push-test
